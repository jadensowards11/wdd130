<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
:root{
    --bg: #E8ECED;
    --card-width: 960px;
    --card-radius: 28px;
    --card-border: 8px;
    --pres-avatar: 150px;
    --quorum-avatar: 108px;
    --avatar-border: 10px;
    --gap-pres: 44px;
    --gap-quorum: 24px;
    --accent-hover: #00b4d8;
    --text: #ffffff;
}

*{box-sizing:border-box}
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    padding:28px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
}
.card{
    width:var(--card-width);
    max-width:96vw;
    border-radius:var(--card-radius);
    border: var(--card-border) solid #000;
    overflow:hidden;
    position:relative;
    background: url('images/christus.webp') center center / cover no-repeat;
    box-shadow: 0 12px 36px rgba(0,0,0,0.28);
    padding:40px 56px 56px 36px;
}

h1.section-title{
    margin:0 0 18px 0;
    text-align:center;
    color:var(--text);
    font-size:38px;
    font-weight:700;
    text-shadow: 0 3px 10px rgba(0,0,0,0.48);
}

.presidency{
    display:flex;
    gap:var(--gap-pres);
    justify-content:center;
    align-items:center;
    margin:8px 0 30px 0;
}

.avatar{
    width:var(--quorum-avatar);
    height:var(--quorum-avatar);
    border-radius:50%;
    overflow:hidden;
    border:var(--avatar-border) solid #fff;
    box-shadow:0 6px 18px rgba(0,0,0,0.45);
    display:inline-block;
    background:#fff;
    transition: border-color 180ms ease, transform 160ms ease, box-shadow 180ms ease;
    cursor:pointer;
    position:relative;
}
.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.presidency .avatar{
    width:var(--pres-avatar);
    height:var(--pres-avatar);
}

.quorum-grid .avatar{
    width:var(--quorum-avatar);
    height:var(--quorum-avatar);
    border-width:var(--avatar-border);
}

.quorum-title{
    margin-top:18px;
    margin-bottom:14px;
    color:var(--text);
    text-align:center;
    font-size:22px;
    text-shadow: 0 3px 8px rgba(0,0,0,0.45);
}

.quorum-grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:var(--gap-quorum) 30px;
    justify-items:center;
    align-items:center;
    padding:6px 20px 0 20px;
}

.quorum-grid .avatar{
    width:var(--quorum-avatar);
    height:var(--quorum-avatar);
    border-width:var(--avatar-border);
}

.avatar:hover,
.avatar:focus-within{
    border-color: var(--accent-hover);
    transform: translateY(-4px);
    box-shadow:0 10px 26px rgba(0,0,0,0.38);
}
.avatar:focus-within::after{
    content:'';
    position:absolute;
    inset:0;
    border-radius:50%;
    box-shadow: 0 0 0 4px rgba(0,180,216,0.12);
    pointer-events:none;
}

.card > *{
    position:relative;
    z-index:2;
}

.card::before{
    content:'';
    position:absolute;
    top:0;
    right:0;
    height:100%;
    width:48%;
    min-width:320px;
    background: linear-gradient(180deg, rgba(13,59,91,0.32), rgba(3,80,107,0.32));
    box-shadow: inset -60px 0 90px rgba(0,0,0,0.18);
    z-index:1;
    border-left:48px solid rgba(255,255,255,0.02);
}

.card::after{
    content:'';
    position:absolute;
    right:72px;
    top:36%;
    width:220px;
    height:220px;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.18), transparent 45%);
    filter: blur(20px);
    transform: translateY(-20px) rotate(8deg);
    z-index:2;
    pointer-events:none;
}

@media (max-width:760px){
    .card{
        padding:24px;
    }
    .presidency .avatar{
        width:100px;
        height:100px;
    }
    .quorum-grid{
        grid-template-columns: repeat(3,1fr);
    }
    .card::before{
        width:46%;
        min-width:180px;
    }
    .card::after{
        right:36px;
        top:30%;
        width:140px;
        height:140px;
    }
}
    </style>
</head>

<body>
    <div class="card">
        <div class="art-stripe" aria-hidden="true"></div>
        <h1 class="section-title">First Presidency</h1>
        <div class="presidency">
            <div class="avatar"><img src="images/nelson.webp" alt="President Nelson"></div>
            <div class="avatar"><img src="images/uchtdorf.webp" alt="President Uchtdorf"></div>
            <div class="avatar"><img src="images/oaks.webp" alt="President Oaks"></div>
        </div>

        <div class="quorum-title">Quorum of the Twelve Apostles</div>
        <div class="quorum-grid">
            <div class="avatar"><img src="images/anderson.webp" alt="Anderson"></div>
            <div class="avatar"><img src="images/bednar.webp" alt="Bednar"></div>
            <div class="avatar"><img src="images/christofferson.webp" alt="Christofferson"></div>
            <div class="avatar"><img src="images/cook.webp" alt="Cook"></div>

            <div class="avatar"><img src="images/eyring.webp" alt="Eyring"></div>
            <div class="avatar"><img src="images/gong.webp" alt="Gong"></div>
            <div class="avatar"><img src="images/holland.webp" alt="Holland"></div>
            <div class="avatar"><img src="images/kearon.webp" alt="Kearon"></div>

            <div class="avatar"><img src="images/rasband.webp" alt="Rasband"></div>
            <div class="avatar"><img src="images/renlund.webp" alt="Renlund"></div>
            <div class="avatar"><img src="images/soares.webp" alt="Soares"></div>
            <div class="avatar"><img src="images/stevenson.webp" alt="Stevenson"></div>
        </div>
    </div>
</body>
</html>
