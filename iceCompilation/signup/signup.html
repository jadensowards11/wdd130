<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%}
        body{
            background:#7a5f3f;
            font-family: 'Georgia', 'Times New Roman', serif;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:32px;
        }
        #formContainer{
            width:420px;
            max-width:92vw;
            border-radius:26px;
            border:12px solid #14346b; 
            overflow:hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #0b274b;
        }
        .hero{
            height:140px;
            background-image: url('images/jesus_feeds_5000.jpeg');
            background-size: cover;
            background-position: center;
            position:relative;
        }
        .hero .title{
            position:absolute;
            left:0;
            right:0;
            top:18px;
            text-align:center;
            color:#fff;
            font-size:32px;
            font-weight:700;
            text-shadow:0 4px 10px rgba(0,0,0,0.6);
            line-height:1;
            padding:0 12px;
        }
        .hero .subtitle{display:block;
            font-size:18px;
            font-weight:600;
            margin-top:6px;}
        .panel{
            background:#fff;
            padding:22px 28px 26px;
            color:#111;
        }
        h3{ 
            text-align:center;
            margin-bottom:14px; 
            font-size:20px }
        form{
            display:block;
        }
        .row{ 
            display:grid;
            grid-template-columns: 1fr 1fr; 
            gap:10px; 
            align-items:center; 
            margin-bottom:12px
         }
        label{ 
            display:block; 
            margin-bottom:6px; 
            font-size:15px 
        }
        input[type="text"], input[type="password"], input[type="email"], input[type="number"]{
            width:100%; 
            padding:8px 8px; 
            border:1px solid #bbb; 
            border-radius:4px; 
            font-size:14px;
        }
        .field{ margin-bottom:12px }
        .gender-row{ display:flex; gap:12px; align-items:center }
        #closeBtn{
            position:absolute; 
            left:10px; 
            top:8px; 
            z-index:20;
            width:28px;
            height:28px;
            border-radius:6px;
            border:1px solid #ddd;
            background:#fff;
            cursor:pointer;
            box-shadow:0 2px 6px rgba(0,0,0,0.2);
        }
        .checkbox{ 
            display:flex; 
            align-items:center; 
            gap:8px; 
            margin:10px 0 }
        .submit-row{ text-align:center; margin-top:10px }
        button[type="submit"]{
            padding:8px 14px; 
            border-radius:6px; 
            border:1px solid #333; 
            background:#eee; 
            cursor:pointer 
        }
    .icon-bar{ 
        display:flex; 
        gap:6px; 
        padding:10px;
        background:#0d0d0f 
    }
    .icon{ 
        flex:1 1 0; 
        height:72px; 
        background:#0b0b0b; 
        color:#ddd; 
        display:block; 
        position:relative; 
        border-left:4px solid rgba(255,255,255,0.03); 
        overflow:hidden; 
        border-radius:2px 
    }
    .icon img{
         width:100%; 
         height:100%; 
         object-fit:cover; 
         display:block 
        }
    .icon .caption{ position:absolute; 
        left:0; 
        right:0; 
        bottom:4px; 
        text-align:center; 
        color:#fff; 
        font-size:11px; 
        font-weight:700; 
        text-shadow:0 1px 2px rgba(0,0,0,0.6); 
        background: linear-gradient(transparent, rgba(0,0,0,0.45)); padding:6px 2px }
        #output{ color:#fff; margin-top:12px }
        @media (max-width:480px){ #formContainer{ width:92vw } .hero{height:110px} .hero .title{font-size:22px} }
    </style>
</head>
<body>
    <div id="formContainer">
        <div class="hero">
            <div class="title">Daily Feed<span class="subtitle">Scripture a Day</span></div>
        </div>
        <div class="panel">
            <button type="button" id="closeBtn">X</button>
            <h3>Sign Up for Daily Scripture Feed</h3>
            <form id="myForm">
                <div class="field">
                    <label for="username">User Name:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="field">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="field">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="field">
                    <label>Gender:</label>
                    <div class="gender-row">
                        <div><input type="radio" id="male" name="gender" value="male" required> <label for="male">Male</label></div>
                        <div><input type="radio" id="female" name="gender" value="female" required> <label for="female">Female</label></div>
                    </div>
                </div>
                <div class="checkbox">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Subscribe to newsletter</label>
                </div>
                <div class="checkbox">
                    <input type="checkbox" id="conditions" name="conditions" required>
                    <label for="conditions">I acknowledge the terms and conditions</label>
                </div>
                <div class="submit-row">
                    <button type="submit">Submit</button>
                </div>
            </form>
        </div>
        <div class="icon-bar">
            <div class="icon">
                <img src="images/old_testament.webp" alt="Old Testament">
                <span class="caption">OLD<br>TESTAMENT</span>
            </div>
            <div class="icon">
                <img src="images/new_testament.webp" alt="New Testament">
                <span class="caption">NEW<br>TESTAMENT</span>
            </div>
            <div class="icon">
                <img src="images/book_of_mormon.webp" alt="Book of Mormon">
                <span class="caption">BOOK<br>OF MORMON</span>
            </div>
            <div class="icon">
                <img src="images/doctrine_and_covenants.webp" alt="Doctrine and Covenants">
                <span class="caption">DOCTRINE<br>AND COVENANTS</span>
            </div>
            <div class="icon">
                <img src="images/pearl_of_great_price.webp" alt="Pearl of Great Price">
                <span class="caption">PEARL OF<br>GREAT PRICE</span>
            </div>
        </div>
    </div>
    <div id="output"></div>
    <script>
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');
        form.addEventListener('submit', function (event) {
            event.preventDefault();
            const formData = new FormData(form);
            const entries = [];
            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }
            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>
</body>
</html>
